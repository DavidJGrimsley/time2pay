name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - test
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  STAGING_SITE_URL: https://lucid-lewin.108-175-12-95.plesk.page
  PRODUCTION_SITE_URL: https://time2pay.app

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup npm
        run: npm install --global npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Run MDS Doctor (static guard)
        shell: bash
        run: |
          set -euo pipefail
          npx -y -p "@mr.dj2u/cli@0.1.24" mds doctor . --ci --json --no-scripts > mds-doctor-report.json
          node -e 'const fs=require("fs"); const report=JSON.parse(fs.readFileSync("mds-doctor-report.json","utf8")); const score=report.summary?.score ?? 0; const errors=report.summary?.errors ?? 0; const warnings=report.summary?.warnings ?? 0; console.log(`MDS Doctor score: ${score} (errors: ${errors}, warnings: ${warnings})`); if (errors > 0 || score < 90) { process.exit(1); }'

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit and integration tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

      - name: Run Expo Doctor
        run: npm run doctor

      - name: Run production build
        run: npm run build:web:deploy

      - name: Build hosted tour artifact for browser smoke tests
        run: npm run build:web:e2e

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  deploy_staging:
    name: Deploy Staging
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Capture deploy start time
        run: |
          echo "DEPLOY_STARTED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_ENV"

      - name: Validate staging webhook secret
        env:
          PLESK_STAGING_WEBHOOK_URL: ${{ secrets.PLESK_STAGING_WEBHOOK_URL }}
        run: |
          if [ -z "$PLESK_STAGING_WEBHOOK_URL" ]; then
            echo "Missing PLESK_STAGING_WEBHOOK_URL secret." >&2
            exit 1
          fi

      - name: Trigger Plesk staging webhook
        env:
          PLESK_STAGING_WEBHOOK_URL: ${{ secrets.PLESK_STAGING_WEBHOOK_URL }}
        run: |
          curl --fail --silent --show-error --request POST "$PLESK_STAGING_WEBHOOK_URL"

      - name: Verify staging deployment
        env:
          SITE_URL: ${{ env.STAGING_SITE_URL }}
        run: |
          node ./scripts/verify-deployment.mjs \
            --label "staging" \
            --site-url "$SITE_URL" \
            --not-before "$DEPLOY_STARTED_AT" \
            --interval-ms 10000 \
            --timeout-ms 600000

  deploy_production:
    name: Deploy Production
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Capture deploy start time
        run: |
          echo "DEPLOY_STARTED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_ENV"

      - name: Validate production webhook secret
        env:
          PLESK_PRODUCTION_WEBHOOK_URL: ${{ secrets.PLESK_PRODUCTION_WEBHOOK_URL || secrets.PLESK__PRODUCTION_WEBHOOK_URL }}
        run: |
          if [ -z "$PLESK_PRODUCTION_WEBHOOK_URL" ]; then
            echo "Missing PLESK_PRODUCTION_WEBHOOK_URL secret. Legacy alias PLESK__PRODUCTION_WEBHOOK_URL is also accepted during migration." >&2
            exit 1
          fi

      - name: Trigger Plesk production webhook
        env:
          PLESK_PRODUCTION_WEBHOOK_URL: ${{ secrets.PLESK_PRODUCTION_WEBHOOK_URL || secrets.PLESK__PRODUCTION_WEBHOOK_URL }}
        run: |
          curl --fail --silent --show-error --request POST "$PLESK_PRODUCTION_WEBHOOK_URL"

      - name: Verify production deployment
        env:
          SITE_URL: ${{ env.PRODUCTION_SITE_URL }}
        run: |
          node ./scripts/verify-deployment.mjs \
            --label "production" \
            --site-url "$SITE_URL" \
            --not-before "$DEPLOY_STARTED_AT" \
            --interval-ms 10000 \
            --timeout-ms 600000
