name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - test
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  STAGING_SITE_URL: https://lucid-lewin.108-175-12-95.plesk.page
  PRODUCTION_SITE_URL: https://time2pay.app

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup npm
        run: npm install --global npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Run Expo doctor
        run: npm run doctor

      - name: Run deploy build
        run: npm run build:web:deploy

  deploy_staging:
    name: Deploy Staging
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Capture deploy start time
        run: |
          echo "DEPLOY_STARTED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_ENV"

      - name: Validate staging webhook secret
        env:
          PLESK_STAGING_WEBHOOK_URL: ${{ secrets.PLESK_STAGING_WEBHOOK_URL }}
        run: |
          if [ -z "$PLESK_STAGING_WEBHOOK_URL" ]; then
            echo "Missing PLESK_STAGING_WEBHOOK_URL secret." >&2
            exit 1
          fi

      - name: Trigger Plesk staging webhook
        env:
          PLESK_STAGING_WEBHOOK_URL: ${{ secrets.PLESK_STAGING_WEBHOOK_URL }}
        run: |
          curl --fail --silent --show-error --request POST "$PLESK_STAGING_WEBHOOK_URL"

      - name: Verify staging deployment
        env:
          SITE_URL: ${{ env.STAGING_SITE_URL }}
        run: |
          node ./scripts/verify-deployment.mjs \
            --label "staging" \
            --site-url "$SITE_URL" \
            --not-before "$DEPLOY_STARTED_AT" \
            --interval-ms 10000 \
            --timeout-ms 600000

  deploy_production:
    name: Deploy Production
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Capture deploy start time
        run: |
          echo "DEPLOY_STARTED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_ENV"

      - name: Validate production webhook secret
        env:
          PLESK_PRODUCTION_WEBHOOK_URL: ${{ secrets.PLESK_PRODUCTION_WEBHOOK_URL || secrets.PLESK__PRODUCTION_WEBHOOK_URL }}
        run: |
          if [ -z "$PLESK_PRODUCTION_WEBHOOK_URL" ]; then
            echo "Missing PLESK_PRODUCTION_WEBHOOK_URL secret. Legacy alias PLESK__PRODUCTION_WEBHOOK_URL is also accepted during migration." >&2
            exit 1
          fi

      - name: Trigger Plesk production webhook
        env:
          PLESK_PRODUCTION_WEBHOOK_URL: ${{ secrets.PLESK_PRODUCTION_WEBHOOK_URL || secrets.PLESK__PRODUCTION_WEBHOOK_URL }}
        run: |
          curl --fail --silent --show-error --request POST "$PLESK_PRODUCTION_WEBHOOK_URL"

      - name: Verify production deployment
        env:
          SITE_URL: ${{ env.PRODUCTION_SITE_URL }}
        run: |
          node ./scripts/verify-deployment.mjs \
            --label "production" \
            --site-url "$SITE_URL" \
            --not-before "$DEPLOY_STARTED_AT" \
            --interval-ms 10000 \
            --timeout-ms 600000
