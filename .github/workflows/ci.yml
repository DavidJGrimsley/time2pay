name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - test
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.11.1

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Run Expo doctor
        run: npm run doctor

      - name: Run deploy build
        run: npm run build:web:deploy

  deploy_staging:
    name: Deploy Staging
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate staging webhook secret
        env:
          PLESK_STAGING_WEBHOOK_URL: ${{ secrets.PLESK_STAGING_WEBHOOK_URL }}
        run: |
          if [ -z "$PLESK_STAGING_WEBHOOK_URL" ]; then
            echo "Missing PLESK_STAGING_WEBHOOK_URL secret." >&2
            exit 1
          fi

      - name: Trigger Plesk staging webhook
        env:
          PLESK_STAGING_WEBHOOK_URL: ${{ secrets.PLESK_STAGING_WEBHOOK_URL }}
        run: |
          curl --fail --silent --show-error --request POST "$PLESK_STAGING_WEBHOOK_URL"

  deploy_production:
    name: Deploy Production
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate production webhook secret
        env:
          PLESK_PRODUCTION_WEBHOOK_URL: ${{ secrets.PLESK_PRODUCTION_WEBHOOK_URL }}
        run: |
          if [ -z "$PLESK_PRODUCTION_WEBHOOK_URL" ]; then
            echo "Missing PLESK_PRODUCTION_WEBHOOK_URL secret." >&2
            exit 1
          fi

      - name: Trigger Plesk production webhook
        env:
          PLESK_PRODUCTION_WEBHOOK_URL: ${{ secrets.PLESK_PRODUCTION_WEBHOOK_URL }}
        run: |
          curl --fail --silent --show-error --request POST "$PLESK_PRODUCTION_WEBHOOK_URL"
