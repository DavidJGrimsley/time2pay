name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck, Test, Doctor, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Run Expo doctor
        run: npm run doctor

      - name: Run deploy build
        run: npm run build:web:deploy

  deploy_plesk:
    name: Trigger Plesk Deploy
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Plesk webhook
        env:
          PLESK_DEPLOY_WEBHOOK_URL: ${{ secrets.PLESK_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$PLESK_DEPLOY_WEBHOOK_URL" ]; then
            echo "Missing PLESK_DEPLOY_WEBHOOK_URL secret." >&2
            exit 1
          fi

          curl --fail --silent --show-error --request POST "$PLESK_DEPLOY_WEBHOOK_URL"
