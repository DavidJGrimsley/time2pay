name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Run Expo doctor
        run: npm run doctor

      - name: Run deploy build
        run: npm run build:web:deploy

  deploy_staging:
    name: Deploy Staging
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Trigger Plesk staging webhook
        env:
          PLESK_STAGING_WEBHOOK_URL: ${{ secrets.PLESK_STAGING_WEBHOOK_URL }}
        run: |
          if [ -z "$PLESK_STAGING_WEBHOOK_URL" ]; then
            echo "Missing PLESK_STAGING_WEBHOOK_URL secret." >&2
            exit 1
          fi

          curl --fail --silent --show-error --request POST "$PLESK_STAGING_WEBHOOK_URL"

      - name: Verify staging is serving this commit
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          PLESK_STAGING_SITE_ORIGIN: ${{ secrets.PLESK_STAGING_SITE_ORIGIN }}
        run: |
          if [ -z "$PLESK_STAGING_SITE_ORIGIN" ]; then
            echo "Missing PLESK_STAGING_SITE_ORIGIN secret." >&2
            exit 1
          fi

          VERIFY_URL="${PLESK_STAGING_SITE_ORIGIN%/}/__time2pay_build.txt"
          echo "Waiting for staging deploy to serve ${EXPECTED_COMMIT_SHA}..."

          ATTEMPTS=30
          SLEEP_SECONDS=10
          for attempt in $(seq 1 "$ATTEMPTS"); do
            live_commit="$(curl --silent --show-error --fail "${VERIFY_URL}?t=$(date +%s)" | tr -d '\r\n' || true)"

            if [ "$live_commit" = "$EXPECTED_COMMIT_SHA" ]; then
              echo "Staging deploy verified on attempt ${attempt}/${ATTEMPTS}."
              exit 0
            fi

            if [ -n "$live_commit" ]; then
              echo "Attempt ${attempt}/${ATTEMPTS}: staging still on ${live_commit}"
            else
              echo "Attempt ${attempt}/${ATTEMPTS}: build marker not reachable yet."
            fi

            sleep "$SLEEP_SECONDS"
          done

          echo "Staging did not serve commit ${EXPECTED_COMMIT_SHA} within $((ATTEMPTS * SLEEP_SECONDS)) seconds." >&2
          exit 1

  deploy_production:
    name: Deploy Production
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Trigger Plesk production webhook
        env:
          PLESK_PRODUCTION_WEBHOOK_URL: ${{ secrets.PLESK_PRODUCTION_WEBHOOK_URL }}
        run: |
          if [ -z "$PLESK_PRODUCTION_WEBHOOK_URL" ]; then
            echo "Missing PLESK_PRODUCTION_WEBHOOK_URL secret." >&2
            exit 1
          fi

          curl --fail --silent --show-error --request POST "$PLESK_PRODUCTION_WEBHOOK_URL"

      - name: Verify production is serving this commit
        env:
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          PLESK_PRODUCTION_SITE_ORIGIN: ${{ secrets.PLESK_PRODUCTION_SITE_ORIGIN }}
        run: |
          if [ -z "$PLESK_PRODUCTION_SITE_ORIGIN" ]; then
            echo "Missing PLESK_PRODUCTION_SITE_ORIGIN secret." >&2
            exit 1
          fi

          VERIFY_URL="${PLESK_PRODUCTION_SITE_ORIGIN%/}/__time2pay_build.txt"
          echo "Waiting for production deploy to serve ${EXPECTED_COMMIT_SHA}..."

          ATTEMPTS=30
          SLEEP_SECONDS=10
          for attempt in $(seq 1 "$ATTEMPTS"); do
            live_commit="$(curl --silent --show-error --fail "${VERIFY_URL}?t=$(date +%s)" | tr -d '\r\n' || true)"

            if [ "$live_commit" = "$EXPECTED_COMMIT_SHA" ]; then
              echo "Production deploy verified on attempt ${attempt}/${ATTEMPTS}."
              exit 0
            fi

            if [ -n "$live_commit" ]; then
              echo "Attempt ${attempt}/${ATTEMPTS}: production still on ${live_commit}"
            else
              echo "Attempt ${attempt}/${ATTEMPTS}: build marker not reachable yet."
            fi

            sleep "$SLEEP_SECONDS"
          done

          echo "Production did not serve commit ${EXPECTED_COMMIT_SHA} within $((ATTEMPTS * SLEEP_SECONDS)) seconds." >&2
          exit 1
